name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate and build
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: npm run check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/module.json
          dist/module.json.sha256
          dist/goffredo-compendium.zip
          dist/goffredo-compendium.zip.sha256
          --generate-notes
          --verify-tag
